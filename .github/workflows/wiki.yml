name: Publish wiki

# Copies the pages in the wiki/ folder to the repository's wiki whenever
# they change on main. Edit the wiki here, not on the Wiki tab: pages
# edited on the Wiki tab are overwritten by the next run.
on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Copy the pages to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          cp wiki/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Update wiki from ${GITHUB_SHA::7}"
          git push
