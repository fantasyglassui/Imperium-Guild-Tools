name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Lua code
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua-check
          luacheck .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        run: |
          pip install lupa pytest
          pytest tests -v
